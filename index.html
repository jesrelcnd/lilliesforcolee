<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>Lilies</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#05070a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c" aria-label="A bouquet of lilies slowly growing and turning, drawn in tiny characters"></canvas>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const sc = document.createElement('canvas'), sg = sc.getContext('2d');            // hidden scene
const sm = document.createElement('canvas'), mg = sm.getContext('2d', { willReadFrequently: true }); // 1 pixel = 1 character
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const CW = 4, CH = 6.4;                    // character cell size in CSS px
const RAMP = '.,:;+=*xX#%@';
const SPEED = 2 * Math.PI / 16000;           // one full turn every 16 seconds
const PITCH = 0.3;                           // camera looks slightly down at the bouquet
let W, H, dpr, cols, rows, L, D, stems, leaves, flowers, stars, total, t0, raf, lastW = 0, spin = 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = v => Math.max(0, Math.min(1, v));
const ease = t => t * t * (3 - 2 * t);
const norm = v => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };
const add = (a, b, k) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const lc = (a, x, b, y) => [a[0] * x + b[0] * y, a[1] * x + b[1] * y, a[2] * x + b[2] * y];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const qpt = (p0, c, e, f) => mix(mix(p0, c, f), mix(c, e, f), f);

function size() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cols = Math.ceil(W / CW); rows = Math.ceil(H / CH);
  sc.width = cols * 4; sc.height = rows * 4;
  sm.width = cols; sm.height = rows;
  mg.imageSmoothingQuality = 'high';
  stars = Array.from({ length: Math.round(W * H / 5000) }, () => ({
    x: rnd(0, W), y: rnd(0, H), r: rnd(.4, 1.1), p: rnd(0, 6.28), s: rnd(.0008, .003)
  }));
}

/* ---- the bouquet lives in 3D: stems rise, leaves unfurl, then each lily opens ---- */
// [outer petals, inner petals]
const PAL = [
  ['#d8263a', '#ee4a5c'], ['#ee5aa5', '#f58bc0'], ['#f6e9d6', '#fffaf0'], ['#f4c42a', '#f8dc6a'],
  ['#c24fc0', '#d982d6'], ['#f58a2b', '#f8ad62'], ['#f7cfdc', '#fde6ee'], ['#a31d3d', '#c4405c']
];

// [angle, distance from centre, height, size, isBud]  (distances and heights in units of L)
const SLOTS = [[0, 0, 2.35, .44]];
for (let k = 0; k < 4; k++) SLOTS.push([.4 + k * 1.5708, .34, 1.9, .34]);
for (let k = 0; k < 5; k++) SLOTS.push([.9 + k * 1.2566, .5, 1.4, .34]);
for (let k = 0; k < 6; k++) SLOTS.push([.2 + k * 1.0472, .58, .9, .3]);
[2.2, 4.3, 5.9].forEach(an => SLOTS.push([an, .28, 1.65, .2, 1]));

function build() {
  stems = []; leaves = []; flowers = [];
  L = Math.min(H * .3, W * .5);
  D = L * 5.5;
  const N = SLOTS.length;
  for (let i = 0; i < N; i++) {
    const sl = SLOTS[i];                                        // one tall lily in the middle, then two rings below it
    const phi = sl[0] + rnd(-.2, .2);
    const r = L * sl[1];
    const h = L * sl[2] + rnd(-.05, .05) * L;
    const e = [Math.cos(phi) * r, h, Math.sin(phi) * r];
    const p0 = [rnd(-8, 8), 0, rnd(-8, 8)];
    const c = [e[0] * .25 + rnd(-10, 10), h * .55, e[2] * .25 + rnd(-10, 10)];
    const start = i * 110, dur = 950 + h * 1.1;
    const st = { p0, c, e, start, dur };
    stems.push(st);

    const nl = 2 + (Math.random() * 2 | 0);                     // leaves along the stem
    for (let k = 0; k < nl; k++) {
      const f = .12 + .7 * (k + Math.random() * .6) / nl;
      const o = qpt(p0, c, e, f);
      const az = Math.atan2(o[2], o[0]) + rnd(-1.2, 1.2);
      leaves.push({
        o, d: norm([Math.cos(az) * .8, rnd(.25, .7), Math.sin(az) * .8]),
        len: L * rnd(.22, .4), w: L * rnd(.028, .04), g: rnd(.1, .35), st, f, dark: Math.random() < .5
      });
    }

    const tan = norm(sub(e, c));
    const out = Math.hypot(e[0], e[2]) < 12 ? [Math.cos(phi), 0, Math.sin(phi)] : norm([e[0], 0, e[2]]);
    const n = norm(add(add(tan, out, 1), [0, 1, 0], .35 - .35));  // each lily faces outward, like a real bouquet
    const a = Math.abs(n[1]) < .9 ? [0, 1, 0] : [1, 0, 0];
    const u = norm(cross(n, a)), v = cross(n, u);
    const bud = !!sl[4];
    flowers.push({
      c: e, n, u, v, R: L * (bud ? .2 : sl[3] * rnd(.92, 1.08)), pal: PAL[(i * 3) % 8],
      rot: rnd(0, 6.28), start: start + dur * .85, bdur: 2800, max: bud ? .18 : 1
    });
  }
  for (let k = 0; k < 12; k++) {                                // leafy base
    const az = k * 2.4 + rnd(-.3, .3);
    leaves.push({
      o: [rnd(-8, 8), 0, rnd(-8, 8)], d: norm([Math.cos(az) * .9, rnd(.7, 1.2), Math.sin(az) * .9]),
      len: L * rnd(.6, 1), w: L * rnd(.045, .06), g: rnd(.1, .4), start: rnd(0, 700), dur: 1000, dark: Math.random() < .5
    });
  }
  let m = 0;
  stems.forEach(s => m = Math.max(m, s.start + s.dur));
  flowers.forEach(f => m = Math.max(m, f.start + f.bdur));
  total = m + 200;
}

/* rotate around the vertical axis, tilt the camera, then apply perspective */
let ca, sa, cp, sp;
function proj(P) {
  const x = P[0] * ca + P[2] * sa, z = -P[0] * sa + P[2] * ca;
  const y = P[1] * cp - z * sp, z2 = P[1] * sp + z * cp;
  const f = D / (D - z2);
  return [W / 2 + x * f, H * .86 - y * f, f, z2];
}

function leafItem(t, lf, items) {
  let lg;
  if (lf.st) lg = clamp((clamp((t - lf.st.start) / lf.st.dur) - lf.f) * 3.2);
  else lg = clamp((t - lf.start) / lf.dur);
  if (lg <= 0) return;
  let perp = cross(lf.d, [0, 1, 0]);
  perp = Math.hypot(perp[0], perp[1], perp[2]) < .05 ? [1, 0, 0] : norm(perp);
  const len = lf.len * lg, Ls = [], Rs = [];
  let zs = 0;
  for (let j = 0; j <= 7; j++) {
    const s = j / 7;
    const P = add(add(lf.o, lf.d, len * s), [0, 1, 0], -lf.g * len * s * s);
    const hw = lf.w * lg * Math.sin(Math.PI * Math.pow(s, .7));
    const pm = proj(P), pl = proj(add(P, perp, hw)), pr = proj(add(P, perp, -hw));
    Ls.push([pl[0], pl[1]]); Rs.push([pr[0], pr[1]]); zs += pm[3];
  }
  items.push({ k: 1, z: zs / 8, pts: Ls.concat(Rs.reverse()), dark: lf.dark });
}

function flowerItems(t, fl, items) {
  if (t < fl.start) return;
  const p = clamp((t - fl.start) / fl.bdur);                    // 0 = tight bud, 1 = fully open
  const c = fl.c, n = fl.n;
  const C = proj(c);
  items.push({ k: 3, z: C[3] - 3, P: C, r: fl.R * .14 * (.3 + .7 * ease(p)) });
  for (let i = 0; i < 6; i++) {
    const outer = i % 2 === 0;
    const bl = fl.max * ease(clamp((p - (outer ? 0 : .16) - i * .012) / .72));   // outer petals open first, inner ones follow
    const rs = .28 + .72 * bl;
    const al = fl.rot + i * 1.0472;
    const rad = lc(fl.u, Math.cos(al), fl.v, Math.sin(al));
    const tan = lc(fl.u, -Math.sin(al), fl.v, Math.cos(al));
    const el = outer ? lerp(1.4, .2, bl) : lerp(1.45, .4, bl);
    const len = fl.R * rs * (outer ? 1 : .92), Wm = fl.R * rs * (outer ? .25 : .29);
    const curl = (outer ? .7 : .5) * bl;
    const ce = Math.cos(el), se = Math.sin(el);
    const Ls = [], Rs = [], Ms = [];
    let zs = 0;
    for (let j = 0; j <= 6; j++) {
      const s = j / 6, k1 = len * s, k2 = len * curl * s * s;
      const P = [
        c[0] + (rad[0] * ce + n[0] * se) * k1 - n[0] * k2,
        c[1] + (rad[1] * ce + n[1] * se) * k1 - n[1] * k2,
        c[2] + (rad[2] * ce + n[2] * se) * k1 - n[2] * k2
      ];
      const w = Wm * Math.sin(Math.PI * Math.pow(s, .8));
      const pm = proj(P), pl = proj(add(P, tan, w)), pr = proj(add(P, tan, -w));
      Ls.push([pl[0], pl[1]]); Rs.push([pr[0], pr[1]]); Ms.push([pm[0], pm[1]]); zs += pm[3];
    }
    items.push({ k: 2, z: zs / 7, pts: Ls.concat(Rs.reverse()), mid: Ms, col: outer ? fl.pal[0] : fl.pal[1], f: C[2] });
  }
  if (p > .45) {                                                // stamens spring out once the flower is open
    const b2 = fl.max * ease(clamp((p - .35) / .6));
    const tips = [];
    let zm = -1e9;
    for (let i = 0; i < 6; i++) {
      const al = fl.rot + .5 + i * 1.0472;
      const rad = lc(fl.u, Math.cos(al), fl.v, Math.sin(al));
      const ln = fl.R * .7 * clamp(b2 + .1);
      const T = proj(add(add(c, rad, ln * .35), n, ln * .85));
      tips.push(T); zm = Math.max(zm, T[3]);
    }
    items.push({ k: 4, z: zm + 4, C, tips, r: fl.R * .05 });
  }
}

/* paint the bouquet at time t, turned by angle a, then read it back as characters */
let cells = [];
function sample(t, a) {
  ca = Math.cos(a); sa = Math.sin(a); cp = Math.cos(PITCH); sp = Math.sin(PITCH);
  const items = [];
  for (const s of stems) {
    const p = clamp((t - s.start) / s.dur);
    if (p <= 0) continue;
    const A = mix(s.p0, s.c, p), B = mix(s.c, s.e, p), T = mix(A, B, p);
    const P0 = proj(s.p0), PA = proj(A), PT = proj(T);
    items.push({ k: 0, z: (P0[3] + PT[3]) / 2, P0, PA, PT });
  }
  for (const lf of leaves) leafItem(t, lf, items);
  for (const fl of flowers) flowerItems(t, fl, items);
  items.sort((u, v) => u.z - v.z);                              // far to near

  sg.setTransform(1, 0, 0, 1, 0, 0);
  sg.globalAlpha = 1;
  sg.fillStyle = '#000'; sg.fillRect(0, 0, sc.width, sc.height);
  sg.setTransform(sc.width / W, 0, 0, sc.height / H, 0, 0);
  sg.lineCap = 'round'; sg.lineJoin = 'round';
  for (const it of items) {
    sg.globalAlpha = .45 + .55 * clamp((it.z + L * 1.4) / (L * 2.8));   // far side fades into the dark
    if (it.k === 0) {
      sg.strokeStyle = '#74cf66';
      sg.lineWidth = 4.6 * it.PT[2];
      sg.beginPath();
      sg.moveTo(it.P0[0], it.P0[1]);
      sg.quadraticCurveTo(it.PA[0], it.PA[1], it.PT[0], it.PT[1]);
      sg.stroke();
    } else if (it.k === 1 || it.k === 2) {
      sg.fillStyle = it.k === 1 ? (it.dark ? '#34a050' : '#52c05c') : it.col;
      sg.beginPath();
      sg.moveTo(it.pts[0][0], it.pts[0][1]);
      for (let i = 1; i < it.pts.length; i++) sg.lineTo(it.pts[i][0], it.pts[i][1]);
      sg.closePath(); sg.fill();
      if (it.k === 2) {
        sg.strokeStyle = 'rgba(0,0,0,.8)'; sg.lineWidth = 2.6 * it.f; sg.stroke();   // dark edge keeps every petal distinct
        sg.strokeStyle = 'rgba(255,255,255,.4)';                // lighter centre line on each petal
        sg.lineWidth = 1.3 * it.f;
        sg.beginPath();
        sg.moveTo(it.mid[0][0], it.mid[0][1]);
        for (let i = 1; i < it.mid.length; i++) sg.lineTo(it.mid[i][0], it.mid[i][1]);
        sg.stroke();
      }
    } else if (it.k === 3) {                                    // green-gold throat
      sg.fillStyle = '#c6df74';
      sg.beginPath(); sg.arc(it.P[0], it.P[1], Math.max(1, it.r * it.P[2]), 0, 6.2832); sg.fill();
    } else {                                                    // stamens: thin filaments with dark anthers
      sg.strokeStyle = '#efe9b0'; sg.lineWidth = 1.2 * it.C[2];
      for (const T of it.tips) { sg.beginPath(); sg.moveTo(it.C[0], it.C[1]); sg.lineTo(T[0], T[1]); sg.stroke(); }
      sg.fillStyle = '#b3501c';
      for (const T of it.tips) { sg.beginPath(); sg.arc(T[0], T[1], Math.max(1, it.r * T[2]), 0, 6.2832); sg.fill(); }
    }
  }
  sg.globalAlpha = 1;

  mg.clearRect(0, 0, cols, rows);
  mg.drawImage(sc, 0, 0, cols, rows);
  const d = mg.getImageData(0, 0, cols, rows).data;
  const out = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = (r * cols + c) * 4, R = d[i], G = d[i + 1], B = d[i + 2];
      const mx = Math.max(R, G, B);
      if (mx < 30) continue;
      const lum = (R * .3 + G * .59 + B * .11) / 255;
      const k = Math.min(255 / mx, 1.7);                       // brighten, keep hue
      const ch = RAMP[Math.min(RAMP.length - 1, (Math.pow(lum, .6) * RAMP.length) | 0)];
      out.push({
        x: c * CW, y: r * CH, ch,
        col: 'rgb(' + ((R * k) & 248) + ',' + ((G * k) & 248) + ',' + ((B * k) & 248) + ')',
        p: (c * 7 + r * 13) % 63 / 10
      });
    }
  }
  cells = out;
}

/* ---- background sparks: plain white glowing embers that orbit and drift up around the bouquet ---- */
const SPRITE = (() => {
  const s = document.createElement('canvas'); s.width = s.height = 48;
  const x = s.getContext('2d'), gr = x.createRadialGradient(24, 24, 0, 24, 24, 24);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(.18, 'rgba(255,255,255,.7)');
  gr.addColorStop(.5, 'rgba(255,255,255,.16)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 48, 48);
  return s;
})();
let sparks = [], lastSp = 0;

function respawn(s, fresh) {
  s.ang = rnd(0, 6.28); s.r = rnd(L * .3, Math.min(L * 1.6, W * .8));
  s.y = fresh ? rnd(-L * .2, L * 2.5) : -L * .2;
  s.vy = rnd(.012, .04); s.w = rnd(.00015, .0005) * (Math.random() < .5 ? -1 : 1);
  s.size = rnd(7, 18); s.tw = rnd(0, 6.28); s.ts = rnd(.002, .006); s.cross = Math.random() < .3;
}

function makeSparks() {
  const n = Math.min(110, Math.max(45, Math.round(W * H / 6500)));
  sparks = Array.from({ length: n }, () => { const s = {}; respawn(s, true); return s; });
}

function drawSparks(now, front) {
  if (!front) {
    const dt = reduce || !lastSp ? 0 : Math.min(now - lastSp, 80);
    lastSp = now;
    for (const s of sparks) {
      s.ang += s.w * dt; s.y += s.vy * dt;
      if (s.y > L * 2.5) respawn(s, false);
      const P = proj([Math.cos(s.ang) * s.r, s.y, Math.sin(s.ang) * s.r]);
      s.sx = P[0]; s.sy = P[1]; s.f = P[2]; s.z = P[3];
    }
  }
  g.globalCompositeOperation = 'lighter';
  for (const s of sparks) {
    if ((s.z >= 0) !== front) continue;                         // far ones sit behind the bouquet, near ones in front
    const tw = .5 + .5 * Math.sin(now * s.ts + s.tw);
    const a = (.25 + .75 * tw) * (front ? 1 : .6);
    const sz = s.size * s.f * (.7 + .5 * tw);
    g.globalAlpha = a;
    g.drawImage(SPRITE, s.sx - sz / 2, s.sy - sz / 2, sz, sz);
    if (s.cross && tw > .75) {                                  // little four-point glints
      g.globalAlpha = (tw - .75) * 4 * a;
      g.fillStyle = '#fff';
      const l = sz * .9;
      g.fillRect(s.sx - l, s.sy - .5, l * 2, 1);
      g.fillRect(s.sx - .5, s.sy - l, 1, l * 2);
    }
  }
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
}

function paint(now, shimmer) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#05070a'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#fff';
  for (const s of stars) {                                      // twinkling stars
    g.globalAlpha = reduce ? .5 : .25 + .6 * (.5 + .5 * Math.sin(now * s.s + s.p));
    g.fillRect(s.x, s.y, s.r, s.r);
  }
  drawSparks(now, false);
  g.font = (CH * .98) + 'px ui-monospace, Menlo, "SF Mono", monospace';
  g.textBaseline = 'top';
  for (const c of cells) {                                      // the bouquet, in tiny characters
    g.globalAlpha = shimmer ? .86 + .14 * Math.sin(now * .0025 + c.p) : 1;
    g.fillStyle = c.col;
    g.fillText(c.ch, c.x, c.y);
  }
  drawSparks(now, true);
  g.globalAlpha = 1;
}

let lastDraw = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  if (now - lastDraw < 33) return;                              // ~30 fps keeps phones cool
  lastDraw = now;
  const t = now - t0;
  sample(Math.min(t, total), t * SPEED + spin);                 // always turning
  paint(now, t >= total);
}

function start() {
  cancelAnimationFrame(raf);
  build(); makeSparks(); spin = 0;
  if (reduce) { sample(total, .6); paint(0, false); return; }
  t0 = performance.now();
  raf = requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  if (innerWidth === lastW) return;                             // ignore iPhone address-bar height changes
  lastW = innerWidth; size(); start();
});

/* drag left/right to spin it by hand; a plain tap grows a new bouquet */
let down = false, moved = false, lastX = 0;
document.addEventListener('pointerdown', e => { down = true; moved = false; lastX = e.clientX; });
document.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - lastX;
  if (Math.abs(dx) > 4) moved = true;
  if (moved) { spin += dx * .012; lastX = e.clientX; }
});
document.addEventListener('pointerup', () => { if (down && !moved) start(); down = false; });
document.addEventListener('pointercancel', () => { down = false; });

size(); lastW = innerWidth; start();
</script>
</body>
</html>
